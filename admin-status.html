<!DOCTYPE html>
<html lang="uk">
<head>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <title>Адмін-панель 3DPrintCraftUA | Live</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
   <style>
    body { 
        font-family: 'Segoe UI', sans-serif; 
        background: url('bg_admin.png') no-repeat center center fixed;
        background-size: cover;
        color: #fff; 
        display: flex; 
        flex-direction: row; /* На компі — в ряд */
        margin: 0; 
        min-height: 100vh; 
    }

    body::before {
        content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.7); z-index: 1;
    }

    #user-list, #order-details { z-index: 2; position: relative; }

    #user-list { 
        width: 320px; background: rgba(26, 26, 26, 0.9); 
        border-right: 2px solid #ff9500; overflow-y: auto; padding: 20px; 
    }
	

    #order-details { flex: 1; padding: 20px; overflow-y: auto; }

    /* АДАПТАЦІЯ ДЛЯ ТЕЛЕФОНІВ (екран менше 768px) */
    @media (max-width: 768px) {
        body { flex-direction: column; } /* Блоки один під одним */
        
        #user-list { 
            width: 100%; 
            height: 300px; /* Обмежуємо висоту списку клієнтів */
            border-right: none; 
            border-bottom: 2px solid #ff9500; 
            box-sizing: border-box;
        }

        #order-details { 
            width: 100%; 
            padding: 15px; 
            box-sizing: border-box;
        }

        .controls { gap: 5px; } /* Тісніше кнопки */
        button { padding: 8px 12px; font-size: 11px; } /* Менші кнопки на мобільці */
    }
	.order-card { 
    background: rgba(30, 30, 30, 0.7); /* Темний колір з прозорістю 70% */
    backdrop-filter: blur(10px); /* Розмиття фону за карткою — буде дуже кльово! */
    -webkit-backdrop-filter: blur(10px);
    padding: 20px; 
    border-radius: 15px; 
    margin-bottom: 20px;
    border: 1px solid rgba(255, 149, 0, 0.3); /* Ледь замітна помаранчева рамка */
    border-left: 6px solid #ff9500; /* Твоя фірмова жирна лінія зліва */
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    max-width: 700px; /* Щоб картка не розтягувалася на весь гігантський екран */
}
/* Основний стиль для всіх кнопок в замовленні */
    .controls button { 
        padding: 10px 20px; 
        border: none; 
        border-radius: 50px; /* Ось це робить їх повністю закругленими */
        cursor: pointer; 
        font-weight: 700; 
        font-size: 13px;
        transition: all 0.2s ease; /* Плавна анімація */
        box-shadow: 0 4px 15px rgba(0,0,0,0.2); /* Легка тінь */
        text-transform: uppercase; /* Робимо текст великими літерами для стилю */
        letter-spacing: 0.5px;
    }

    /* Ефект при наведенні мишкою */
    .controls button:hover {
        transform: translateY(-3px); /* Кнопка трохи піднімається */
        box-shadow: 0 6px 20px rgba(255, 149, 0, 0.3); /* Тінь стає яскравішою */
        filter: brightness(1.1); /* Стає трохи світлішою */
    }

    /* Акцент на кнопку видалення (червоний хрестик) */
    .btn-delete { 
        background: #ff4444 !important; 
        color: white; 
        width: 40px; /* Робимо її круглою */
        height: 40px;
        padding: 0 !important;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px !important;
    }

    /* Кольори для етапів (якщо ти використовуєш ці класи) */
    .btn-print { background: #00d4ff; color: #000; }
    .btn-ready { background: #28a745; color: #fff; }
    .btn-shipping { background: #6f42c1; color: #fff; }
	
	.status-label b {
    color: #ff9500;
    text-shadow: 0 0 10px rgba(255, 149, 0, 0.5); /* М'яке світіння тексту */
    background: rgba(255, 149, 0, 0.1);
    padding: 2px 8px;
    border-radius: 4px;
}
</style>
</head>
<body>

    <div id="user-list">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h2 style="margin:0;">Клієнти</h2>
        <button onclick="goHome()" style="background: #444; color: white; border-radius:10px; padding: 5px 10px; border:none; cursor:pointer;">Home 🏠</button>
    </div>

    <input type="text" id="user-search" placeholder="Пошук (ім'я або тел...)" 
           style="width: 100%; padding: 10px; border-radius: 20px; border: 1px solid #444; background: rgba(0,0,0,0.5); color: white; margin-bottom: 20px; box-sizing: border-box; outline: none;">
    
    <div id="users-container">Завантаження...</div>
</div>

    <div id="order-details">
        <h2 id="detail-title">Виберіть клієнта</h2>
        <div id="orders-container"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAban86otzMqDuk_XwnqADDNPHICU9tFFs",
            authDomain: "d-shop-status.firebaseapp.com",
            projectId: "d-shop-status",
            databaseURL: "https://d-shop-status-default-rtdb.europe-west1.firebasedatabase.app/",
            appId: "1:286708501499:web:eb82c5cf7f7f92746ed95e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let activePhone = null;

        // 1. РЕАЛЬНИЙ ЧАС: Список користувачів
        let allOrdersCache = {}; // Створимо кеш для пошуку

db.ref('orders').on('value', (snapshot) => {
    allOrdersCache = snapshot.val() || {};
    renderUserList(""); // При отриманні даних показуємо всіх
});

// Функція для відображення списку з фільтром
// Надійний пошук без "вигадок"
function renderUserList(filter) {
    const container = document.getElementById('users-container');
    container.innerHTML = '';
    const searchTerm = filter.toLowerCase().trim();

    Object.keys(allOrdersCache).forEach(phone => {
        const orders = allOrdersCache[phone];
        const lastOrder = Object.values(orders).pop();
        
        // Перевіряємо тільки те, що реально ввів користувач
        const userName = lastOrder.customer ? lastOrder.customer.toLowerCase() : "";
        const userPhone = phone.toLowerCase();

        if (searchTerm === "" || userName.includes(searchTerm) || userPhone.includes(searchTerm)) {
            const div = document.createElement('div');
            div.className = `user-item ${activePhone === phone ? 'active' : ''}`;
            div.innerHTML = `<div>${lastOrder.customer}</div><small>${phone}</small>`;
            div.onclick = () => selectUser(phone);
            container.appendChild(div);
        }
    });
}

// Слухач для поля пошуку
document.getElementById('user-search').addEventListener('input', (e) => {
    renderUserList(e.target.value);
});

        // Функція для повернення на "головну" адмінки
function goHome() {
    activePhone = null;
    document.getElementById('detail-title').innerText = "Виберіть клієнта";
    document.getElementById('orders-container').innerHTML = '';
    // Знімаємо підсвітку з усіх кнопок зліва
    document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
}

function selectUser(phone) {
    // Якщо клікаємо на того самого, хто вже відкритий — закриваємо (Home)
    if (activePhone === phone) {
        goHome();
        return;
    }

    activePhone = phone;
    
    // Оновлюємо візуальний вибір у списку
    document.querySelectorAll('.user-item').forEach(el => {
        el.classList.remove('active');
        if (el.innerHTML.includes(phone)) el.classList.add('active');
    });

    // Отримуємо дані один раз для миттєвого відображення, 
    // а далі працює .on('value') з основного коду
    db.ref('orders/' + phone).once('value', (s) => renderOrders(s.val()));
}

        // 2. РЕАЛЬНИЙ ЧАС: Відображення замовлень
       function renderOrders(orders) {
    const container = document.getElementById('orders-container');
    document.getElementById('detail-title').innerText = `Замовлення: ${activePhone}`;
    container.innerHTML = '';

    if (!orders) return;

    Object.keys(orders).reverse().forEach(id => {
        const order = orders[id];
        const card = document.createElement('div');
        card.className = 'order-card';
        card.innerHTML = `
            <div class="order-time">ID: #${id} | ${order.time}</div>
            <div class="status-label">Статус: <b>${order.status}</b></div>
            <div style="font-size: 18px; margin: 10px 0; color: #ff9500;">${order.item}</div>
            
            <div class="controls">
                <button style="background: #555; color: white;" onclick="setStatus('${id}', '⏳ В черзі')">Черга</button>
                <button style="background: #f1c40f; color: black;" onclick="setStatus('${id}', '✅ Підтверджено')">Ок</button>

                <button class="btn-print" onclick="setStatus('${id}', '⚙️ Друкується')">Друк</button>
                <button style="background: #e67e22; color: white;" onclick="setStatus('${id}', '🛠️ Обробка')">Обробка</button>

                <button class="btn-ready" onclick="setStatus('${id}', '📫 упакуваня')">упакуваня</button>
                <button class="btn-shipping" onclick="setStatus('${id}', '🚚 У дорозі')">Дорога</button>
                <button style="background: #27ae60; color: white;" onclick="setStatus('${id}', '🏁 Отримано')">Видано</button>

                <button class="btn-delete" onclick="deleteOrder('${id}')">❌</button>
            </div>
        `;
        container.appendChild(card);
    });
}

        // 3. ЗМІНА СТАТУСУ (Миттєво)
        function setStatus(orderId, text) {
            if (!activePhone) return;
            db.ref(`orders/${activePhone}/${orderId}`).update({ status: text });
        }

        // 4. ВИДАЛЕННЯ (З автоматичним поверненням на головну)
function deleteOrder(orderId) {
    if (confirm("Видалити це замовлення безповоротно?")) {
        db.ref(`orders/${activePhone}/${orderId}`).remove().then(() => {
            // Оце той самий рядок, який "закриє" меню клієнта після видалення
            goHome(); 
        });
    }
}
    </script>
</body>
</html>
